<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Radial ambient glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes dashflow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes beaconRing {
        0% { r: 6; opacity: 0.9; }
        100% { r: 24; opacity: 0; }
      }

      .flow-line {
        stroke-dasharray: 8 12;
        animation: dashflow 18s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6 10;
        animation: dashflow 14s linear infinite reverse;
      }
      .node-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .float-node {
        animation: floatParticle 5s ease-in-out infinite;
      }
      .beacon {
        animation: beaconRing 3s ease-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .mono-text {
        font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  <rect width="1200" height="400" fill="url(#glowLeft)" />
  <rect width="1200" height="400" fill="url(#glowRight)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND FLOW ELEMENTS (strictly behind content) -->
  <g opacity="0.45">
    <!-- Audit Log Trail Path 1 -->
    <path class="flow-line" d="M -50,110 C 250,50 400,160 650,110 C 900,60 1050,150 1250,100" fill="none" stroke="#6366f1" stroke-width="2" />
    <!-- Audit Log Trail Path 2 -->
    <path class="flow-line-reverse" d="M -50,310 C 220,360 450,260 720,320 C 980,380 1100,280 1250,310" fill="none" stroke="#0ea5e9" stroke-width="2" />
    <!-- Secondary connector line -->
    <path class="flow-line" d="M 100,200 L 1100,200" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- Animated Background Trace Nodes -->
  <g class="float-node" opacity="0.7">
    <!-- Left Audit Block -->
    <g transform="translate(90, 80)">
      <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle class="beacon" cx="0" cy="0" r="6" fill="none" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#a5b4fc" />
    </g>

    <!-- Right Cryptographic Hash Block -->
    <g transform="translate(1110, 310)">
      <circle cx="0" cy="0" r="18" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5" />
      <circle class="beacon" cx="0" cy="0" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#7dd3fc" />
    </g>

    <!-- Ambient Floating Data Packets -->
    <rect class="node-pulse" x="140" y="270" width="120" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.6" />
    <text class="mono-text" x="200" y="292" fill="#94a3b8" font-size="11" text-anchor="middle" letter-spacing="0.5">SHA256:TAMPER_PROOF</text>

    <rect class="node-pulse" x="930" y="90" width="130" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.6" />
    <text class="mono-text" x="995" y="112" fill="#94a3b8" font-size="11" text-anchor="middle" letter-spacing="0.5">RETENTION:10_YEARS</text>
  </g>

  <!-- Top Decorative Top Border Glow -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#primaryGlow)" stroke-width="2.5" opacity="0.85" />

  <!-- ======================================================== -->
  <!-- FOREGROUND CONTENT: Guaranteed high-contrast and clear   -->
  <!-- ======================================================== -->

  <!-- Category Badge Pill -->
  <g transform="translate(600, 75)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <circle cx="-165" cy="0" r="4" fill="#38bdf8" />
    <text class="mono-text" x="-150" y="4" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.2">FIELD AUDIT TRAIL &amp; HISTORY</text>
    <text class="mono-text" x="120" y="4" fill="#a5b4fc" font-size="11.5" font-weight="600">v2026</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <!-- Subtle drop shadow glow -->
    <text class="title-text" x="0" y="0" text-anchor="middle" font-size="44" fill="#020617" opacity="0.8" dy="2">
      Awesome Field Audit Trail &amp; History
    </text>
    <!-- Foreground crisp title with gradient -->
    <text class="title-text" x="0" y="0" text-anchor="middle" font-size="44" fill="url(#primaryGlow)">
      Awesome Field Audit Trail &amp; History
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 205)">
    <text class="sub-text" x="0" y="0" text-anchor="middle" font-size="18.5" fill="#e2e8f0" letter-spacing="-0.01em">
      Curated Directory of Enterprise SaaS &amp; Open-Source Compliance Infrastructure
    </text>
    <text class="sub-text" x="0" y="28" text-anchor="middle" font-size="14" fill="#94a3b8">
      Field-Level Change Tracking • Immutable Audit Logs • Data Retention • Forensic Archiving
    </text>
  </g>

  <!-- Feature Pill Tags in Foreground -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: SOX & HIPAA -->
    <g transform="translate(-375, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="sub-text" x="82.5" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">
        ⚖️ SOX &amp; HIPAA Ready
      </text>
    </g>

    <!-- Pill 2: Cryptographic Proof -->
    <g transform="translate(-190, 0)">
      <rect x="0" y="0" width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="sub-text" x="87.5" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">
        🔐 Tamper-Evident Logs
      </text>
    </g>

    <!-- Pill 3: Change Data Capture -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="sub-text" x="90" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">
        ⚡ Change Data Capture
      </text>
    </g>

    <!-- Pill 4: Long-Term Archiving -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text class="sub-text" x="85" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">
        📦 10-Yr+ Data Archiving
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="250" y1="375" x2="950" y2="375" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
</svg>
